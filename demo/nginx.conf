# Balanceador de la demo: reparte las peticiones entre las dos réplicas, una y una (round robin).
# Si una réplica no contesta, la petición pasa a la otra y esa réplica se deja de usar 10 segundos.
upstream api {
    zone api 64k;   # turnos compartidos entre los procesos de nginx: si no, cada uno empieza por la réplica 1
    server 172.28.0.11:8080 max_fails=1 fail_timeout=10s;
    server 172.28.0.12:8080 max_fails=1 fail_timeout=10s;
}

# nombre de la réplica que ha contestado, para la cabecera X-Replica
map $upstream_addr $replica {
    "172.28.0.11:8080" "replica-1";
    "172.28.0.12:8080" "replica-2";
    default            $upstream_addr;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Replica $replica always;
    }
}
