spring.application.name=smart-campus-api
server.port=8080

# MySQL del docker-compose.yml (puerto 3307). Con el MySQL local, cambiar a 3306 y su usuario
spring.datasource.url=jdbc:mysql://localhost:3307/smart_campus
spring.datasource.username=smartcampus
spring.datasource.password=smartcampus

# las tablas las crea el script de sql/: JPA solo comprueba que casan con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
