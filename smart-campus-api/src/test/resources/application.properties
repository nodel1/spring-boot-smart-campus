# configuración de los tests: H2 en memoria en vez del MySQL de Docker
# NON_KEYWORDS porque en H2 "value" y "timestamp" son palabras reservadas (en MySQL no)
spring.datasource.url=jdbc:h2:mem:smart_campus;MODE=MySQL;NON_KEYWORDS=VALUE,TIMESTAMP
spring.datasource.username=sa
spring.datasource.password=
# aquí no está el script de sql/, así que JPA crea las tablas desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
