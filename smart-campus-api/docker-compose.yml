# MySQL de la práctica 1. Arranque: docker compose up -d   Parada: docker compose down
# nombre propio del proyecto para que no choque con otra copia (la PR2 parte de esta)
name: smart-campus-pr1

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_campus
      MYSQL_USER: smartcampus
      MYSQL_PASSWORD: smartcampus
    ports:
      - "3307:3306"   # 3307 fuera para no chocar con el MySQL 8.0 instalado en Windows (3306)
    volumes:
      - mysql-data:/var/lib/mysql
      # los scripts entregados crean y llenan la base la primera vez (se ejecutan por orden de nombre)
      - ../sql/smart_campus_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ../sql/smart_campus_datos.sql:/docker-entrypoint-initdb.d/2_datos.sql:ro
    healthcheck:
      # por TCP y no por socket: así no da "sano" mientras se cargan los scripts
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
